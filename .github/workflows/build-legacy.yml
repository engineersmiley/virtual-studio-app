name: Build Legacy macOS Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: legacy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac-legacy:
    runs-on: macos-13
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check macOS version
        run: sw_vers

      - name: Use legacy package.json
        working-directory: virtual-studio-agent
        run: |
          cp package-legacy.json package.json
          echo "=== package.json contents ==="
          cat package.json

      - name: Install dependencies
        working-directory: virtual-studio-agent
        run: |
          npm install --legacy-peer-deps
          echo "=== node_modules installed ==="
          ls -la node_modules/

      - name: Rebuild native modules
        working-directory: virtual-studio-agent
        run: npm run postinstall || true

      - name: Build for macOS Legacy
        working-directory: virtual-studio-agent
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder

      - name: List build output
        working-directory: virtual-studio-agent
        run: |
          echo "=== dist folder contents ==="
          ls -la dist/ || echo "No dist folder"
          echo "=== all zip files ==="
          find . -name "*.zip" -type f

      - name: Rename zip file
        working-directory: virtual-studio-agent/dist
        run: |
          for f in *.zip; do 
            echo "Renaming $f to Virtual.Studio.Agent-legacy.zip"
            mv "$f" "Virtual.Studio.Agent-legacy.zip" 2>/dev/null || true
          done
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: legacy-mac-zip
          path: virtual-studio-agent/dist/Virtual.Studio.Agent-legacy.zip

      - name: Add to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: virtual-studio-agent/dist/Virtual.Studio.Agent-legacy.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
