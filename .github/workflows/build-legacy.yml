name: Build Legacy macOS Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac-legacy:
    runs-on: macos-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Use legacy package.json
        working-directory: virtual-studio-agent
        run: |
          cp package-legacy.json package.json
          cat package.json

      - name: Install dependencies
        working-directory: virtual-studio-agent
        run: npm install --legacy-peer-deps

      - name: Build for macOS Legacy
        working-directory: virtual-studio-agent
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List build output
        working-directory: virtual-studio-agent
        run: ls -la dist/

      - name: Rename zip file
        working-directory: virtual-studio-agent/dist
        run: |
          for f in *.zip; do mv "$f" "Virtual.Studio.Agent-legacy.zip" 2>/dev/null || true; done
          ls -la

      - name: Create Legacy Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Virtual Studio Agent ${{ github.ref_name }}
          files: virtual-studio-agent/dist/Virtual.Studio.Agent-legacy.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
