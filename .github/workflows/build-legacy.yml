name: Build Legacy macOS Agent

on:
  push:
    tags:
      - 'legacy-v*'
  workflow_dispatch:

jobs:
  build-mac-legacy:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup legacy build
        working-directory: virtual-studio-agent
        run: |
          cp package-legacy.json package.json
          npm install

      - name: Build for macOS Legacy
        working-directory: virtual-studio-agent
        run: npm run build:mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: remote-studio-agent-mac-legacy
          path: virtual-studio-agent/dist/*.zip

  release:
    needs: [build-mac-legacy]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download macOS Legacy artifact
        uses: actions/download-artifact@v4
        with:
          name: remote-studio-agent-mac-legacy
          path: ./dist

      - name: Rename file
        run: |
          cd dist
          for f in *.zip; do mv "$f" "Remote.Studio.Agent.Legacy.zip" 2>/dev/null || true; done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Remote Studio Agent Legacy ${{ github.ref_name }}
          body: |
            ## Remote Studio Agent Legacy ${{ github.ref_name }}
            
            For older macOS (10.11 - 10.14):
            - **macOS Legacy**: Remote.Studio.Agent.Legacy.zip
          files: |
            dist/Remote.Studio.Agent.Legacy.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
