name: Build Legacy macOS

on:
  workflow_dispatch:

jobs:
  build-mac-legacy:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Use legacy package.json
        working-directory: virtual-studio-agent
        run: cp package-legacy.json package.json

      - name: Install dependencies for x64
        working-directory: virtual-studio-agent
        run: npm install
        env:
          npm_config_arch: x64

      - name: Rebuild native modules for x64
        working-directory: virtual-studio-agent
        run: ./node_modules/.bin/electron-builder install-app-deps --arch x64

      - name: Build for macOS Intel (x64)
        working-directory: virtual-studio-agent
        run: npm run build:mac -- --x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virtual-studio-agent-mac-legacy
          path: virtual-studio-agent/dist/*.zip
