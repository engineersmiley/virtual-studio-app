name: Build Virtual Studio Agent for Windows

on:
  push:
    tags:
      - 'windows-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Windows Agent release tag
        required: true
        default: windows-v1.20.9
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Agent dependencies
        working-directory: virtual-studio-agent
        run: npm install

      - name: Build Windows installer
        working-directory: virtual-studio-agent
        run: npm run build:win

      - name: Normalize installer filename
        shell: pwsh
        run: |
          $target = "virtual-studio-agent/dist/Virtual.Studio.Agent.Setup.exe"
          if (-not (Test-Path $target)) {
            $installer = Get-ChildItem "virtual-studio-agent/dist" -Filter "*.exe" |
              Select-Object -First 1
            if (-not $installer) {
              throw "electron-builder did not produce a Windows installer."
            }
            Move-Item $installer.FullName $target -Force
          }
          if (-not (Test-Path $target)) {
            throw "The normalized Windows installer is missing."
          }

      - name: Publish Windows Agent release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Virtual Studio Agent Windows ${{ inputs.release_tag || github.ref_name }}
          body: |
            Windows-only Virtual Studio Agent installer.

            This version supports scaled Windows displays when the artist approves the cursor-only alignment test. Mouse clicks and keyboard input remain blocked until the artist confirms alignment in the Agent.
          files: virtual-studio-agent/dist/Virtual.Studio.Agent.Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
