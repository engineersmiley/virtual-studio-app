name: Build Virtual Studio Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false
        default: '1.0.0'

env:
  AGENT_VERSION: ${{ github.event.inputs.version || '1.0.0' }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact_pattern: "*.exe"
          - os: macos-latest
            platform: mac
            artifact_pattern: "*.dmg"
          - os: ubuntu-latest
            platform: linux
            artifact_pattern: "*.AppImage"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: virtual-studio-agent
        run: npm install

      - name: Build for ${{ matrix.platform }}
        working-directory: virtual-studio-agent
        run: npm run build:${{ matrix.platform }}

      - name: List build output
        working-directory: virtual-studio-agent/dist
        run: ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virtual-studio-agent-${{ matrix.platform }}
          path: virtual-studio-agent/dist/${{ matrix.artifact_pattern }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: virtual-studio-agent-win
          path: ./dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: virtual-studio-agent-mac
          path: ./dist

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: virtual-studio-agent-linux
          path: ./dist

      - name: List all artifacts
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Virtual Studio Agent ${{ github.ref_name }}
          body: |
            ## Virtual Studio Agent ${{ github.ref_name }}
            
            Download the installer for your operating system:
            - **Windows**: Virtual Studio Agent Setup.exe
            - **macOS**: Virtual Studio Agent.dmg
            - **Linux**: Virtual Studio Agent.AppImage
            
            ### Installation
            1. Download the installer for your OS
            2. Run the installer
            3. Open Virtual Studio Agent
            4. Enter your session code and connect
            
            ### Requirements
            - **Windows**: Windows 10 or later
            - **macOS**: macOS 10.15 (Catalina) or later
            - **Linux**: Any modern distribution with AppImage support
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
