name: Build Virtual Studio Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false
        default: '1.0.0'

env:
  AGENT_VERSION: ${{ github.event.inputs.version || '1.0.0' }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: virtual-studio-agent
        run: npm install

      - name: Build for Windows
        working-directory: virtual-studio-agent
        run: npm run build:win

      - name: List build output
        working-directory: virtual-studio-agent/dist
        run: dir

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virtual-studio-agent-win
          path: virtual-studio-agent/dist/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: virtual-studio-agent
        run: npm install

      - name: Build for macOS
        working-directory: virtual-studio-agent
        run: npm run build:mac

      - name: List build output
        working-directory: virtual-studio-agent/dist
        run: ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virtual-studio-agent-mac
          path: virtual-studio-agent/dist/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libpng-dev

      - name: Install dependencies
        working-directory: virtual-studio-agent
        run: npm install

      - name: Build for Linux
        working-directory: virtual-studio-agent
        run: npm run build:linux

      - name: List build output
        working-directory: virtual-studio-agent/dist
        run: ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virtual-studio-agent-linux
          path: virtual-studio-agent/dist/*.AppImage

  release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: virtual-studio-agent-win
          path: ./dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: virtual-studio-agent-mac
          path: ./dist

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: virtual-studio-agent-linux
          path: ./dist

      - name: List all artifacts
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Virtual Studio Agent ${{ github.ref_name }}
          body: |
            ## Virtual Studio Agent ${{ github.ref_name }}
            
            Download the installer for your operating system:
            - **Windows**: Virtual Studio Agent Setup.exe
            - **macOS**: Virtual Studio Agent.dmg
            - **Linux**: Virtual Studio Agent.AppImage
            
            ### Installation
            1. Download the installer for your OS
            2. Run the installer
            3. Open Virtual Studio Agent
            4. Enter your session code and connect
            
            ### Requirements
            - **Windows**: Windows 10 or later
            - **macOS**: macOS 10.15 (Catalina) or later
            - **Linux**: Any modern distribution with AppImage support
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
