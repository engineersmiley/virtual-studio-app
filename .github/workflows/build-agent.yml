name: Build Virtual Studio Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: virtual-studio-agent
        run: npm install

      - name: Build for Windows
        working-directory: virtual-studio-agent
        run: npm run build:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virtual-studio-agent-win
          path: virtual-studio-agent/dist/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: virtual-studio-agent
        run: npm install

      - name: Build for macOS
        working-directory: virtual-studio-agent
        run: npm run build:mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virtual-studio-agent-mac
          path: virtual-studio-agent/dist/*.dmg

  build-mac-legacy:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup legacy build
        working-directory: virtual-studio-agent
        run: |
          cp package-legacy.json package.json
          npm install

      - name: Build legacy macOS
        working-directory: virtual-studio-agent
        run: npm run build:mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virtual-studio-agent-mac-legacy
          path: virtual-studio-agent/dist-legacy/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libpng-dev

      - name: Install dependencies
        working-directory: virtual-studio-agent
        run: npm install

      - name: Build for Linux
        working-directory: virtual-studio-agent
        run: npm run build:linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virtual-studio-agent-linux
          path: virtual-studio-agent/dist/*.AppImage

  release:
    needs: [build-windows, build-mac, build-mac-legacy, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: virtual-studio-agent-win
          path: ./dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: virtual-studio-agent-mac
          path: ./dist

      - name: Download macOS legacy artifact
        uses: actions/download-artifact@v4
        with:
          name: virtual-studio-agent-mac-legacy
          path: ./dist

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: virtual-studio-agent-linux
          path: ./dist

      - name: List all artifacts
        run: ls -la dist/

      - name: Rename files for consistent download URLs
        run: |
          cd dist
          for f in *.exe; do mv "$f" "Virtual.Studio.Agent.Setup.exe" 2>/dev/null || true; done
          for f in *.AppImage; do mv "$f" "Virtual.Studio.Agent.AppImage" 2>/dev/null || true; done
          for f in *Legacy*.dmg; do mv "$f" "Virtual.Studio.Agent-legacy.dmg" 2>/dev/null || true; done
          for f in *.dmg; do 
            if [[ "$f" != "Virtual.Studio.Agent-legacy.dmg" ]]; then
              mv "$f" "Virtual.Studio.Agent.dmg" 2>/dev/null || true
            fi
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Virtual Studio Agent ${{ github.ref_name }}
          body: |
            ## Virtual Studio Agent ${{ github.ref_name }}
            
            Download the installer for your operating system:
            - **Windows**: Virtual.Studio.Agent.Setup.exe
            - **macOS 11+**: Virtual.Studio.Agent.dmg
            - **macOS 10.11-10.14**: Virtual.Studio.Agent-legacy.dmg
            - **Linux**: Virtual.Studio.Agent.AppImage
          files: |
            dist/Virtual.Studio.Agent.Setup.exe
            dist/Virtual.Studio.Agent.dmg
            dist/Virtual.Studio.Agent-legacy.dmg
            dist/Virtual.Studio.Agent.AppImage
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
