name: Pull Request TypeScript

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    # This name is required by main's merge protection. Keep it stable.
    name: PR TypeScript check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Test workflow contracts
        run: npm run test:workflows

      - name: Test remote video input
        run: npm test

      - name: Install mobile test browser
        run: npx playwright install --with-deps chromium

      - name: Test mobile browser touch input
        run: npm run test:mobile

      - name: Build root web app
        run: npm run build

      - name: Check smoke runner failure handling
        run: npm run test:production:runner

      - name: Install disposable database tools
        run: sudo apt-get update && sudo apt-get install -y postgresql

      - name: Smoke test production startup
        run: npm run test:production

      - name: Check application schema compatibility
        run: npm run test:schema
