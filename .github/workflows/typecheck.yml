name: Pull Request TypeScript

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    # This name is required by main's merge protection. Keep it stable.
    name: PR TypeScript check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check
